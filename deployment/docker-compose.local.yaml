services:
  redis:
    image: 'redis'
    networks:
      - es-net
  api:
    env_file: ./.env
    build:
      context: ..
      dockerfile: ./deployment/Dockerfile
    image: 'nestjs-mongoose-api'
    volumes:
      - ./src:/app/src
      - /var/log/nestjs-mongoose:/var/log/nestjs-mongoose
    ports:
      - '5100:5100'
    links:
      - 'redis'
    networks:
      - es-net
    depends_on:
      - 'redis'

networks:
  es-net:
    driver: bridge
